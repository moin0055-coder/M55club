<!DOCTYPE html>
<html>
<head>
  <title>M55Club</title>
  <style>
    body { background:#0f0f0f; color:#fff; text-align:center; font-family:sans-serif;}
    input,button { padding:10px; margin:5px; border:none; border-radius:8px;}
    button { background:gold; color:black; font-weight:bold;}
    .box { margin-top:20px;}
  </style>
</head>
<body>

<h1>🔥 M55Club</h1>

<div class="box">
  <input id="user" placeholder="username">
  <input id="pass" placeholder="password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div class="box">
  <h3>Coins: <span id="coins">0</span></h3>
</div>

<div class="box">
  <h3>⏱ Timer: <span id="timer">20</span></h3>
  <h3>🎯 Current Number: <span id="round">-</span></h3>
</div>

<div class="box">
  <input id="num" placeholder="0-9">
  <button onclick="play()">Play</button>
</div>

<p id="out"></p>

<script>
let token="";
let t=20;

// register
function register(){
 fetch("/api/auth/register",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username:user.value,password:pass.value})
 }).then(r=>r.json()).then(d=>alert(d.msg));
}

// login
function login(){
 fetch("/api/auth/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username:user.value,password:pass.value})
 }).then(r=>r.json()).then(d=>{
  token=d.token;
  alert("Login success");
  balance();
 });
}

// balance
function balance(){
 fetch("/api/wallet/balance",{headers:{"auth-token":token}})
 .then(r=>r.json()).then(d=>{
  coins.innerText=d.coins;
 });
}

// play
function play(){
 fetch("/api/game/play",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "auth-token":token
  },
  body:JSON.stringify({number:num.value})
 })
 .then(r=>r.json())
 .then(d=>{
  out.innerText="Result: "+d.result+" | "+d.currentNumber;
  balance();
 });
}

// timer
setInterval(()=>{
 t--;
 if(t<=0) t=20;
 timer.innerText=t;
},1000);

// round update
setInterval(()=>{
 fetch("/api/game/round")
 .then(r=>r.json())
 .then(d=>round.innerText=d.currentNumber);
},2000);
</script>

</body>
</html>
